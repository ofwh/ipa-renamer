name: Build and push container image

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: Tag to build, e.g. v1.2.3.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build, e.g. v1.2.3.
        required: true
        type: string

concurrency:
  # Keyed on the tag, not github.ref: inside a called workflow github.ref is the
  # caller's branch, which would collapse every release into one group.
  group: container-image-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push multi-arch image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Callers pass a tag; a tag push leaves inputs.tag empty and falls back to github.ref.
          ref: ${{ inputs.tag || github.ref }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image metadata
        id: meta
        env:
          REF: ${{ inputs.tag || github.ref }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY}"
          tag="${REF##refs/tags/}"
          version="${tag#v}"
          tags="${image}:${tag},${image}:${version}"
          # A version carrying a prerelease suffix never moves :latest.
          if [[ "${version}" != *-* ]]; then
            tags="${tags},${image}:latest"
          fi
          echo "tags=${tags}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
