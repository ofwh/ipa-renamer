name: release

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: Tag to build and publish, e.g. v1.2.3.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and publish, e.g. v1.2.3.
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Callers pass a tag; a tag push leaves inputs.tag empty and falls back to github.ref.
          ref: ${{ inputs.tag || github.ref }}
          # Full history: GoReleaser reads tags and builds the changelog from it.
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
