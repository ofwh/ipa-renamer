name: auto-tag

on:
  push:
    branches: [main, release]
  workflow_dispatch:

# Ceiling for the reusable workflows called below: they cannot exceed this.
permissions:
  contents: write
  packages: write

# Serialize runs so two quick pushes cannot race on the same next version.
concurrency:
  group: auto-tag-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    name: Derive version and push tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.normalize.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history: the action needs every reachable tag to compute the next version.
          fetch-depth: 0
      - name: Bump version and push tag
        id: bump
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_branches: ^main$,^release$
          # feat/fix/breaking produce a tag; docs/chore/ci pushes produce none.
          default_bump: false
      - name: Normalize tag output
        id: normalize
        env:
          NEW_TAG: ${{ steps.bump.outputs.new_tag }}
        run: |
          set -euo pipefail
          case "${NEW_TAG}" in
            "" | "undefined") echo "tag=" >> "${GITHUB_OUTPUT}" ;;
            *) echo "tag=${NEW_TAG}" >> "${GITHUB_OUTPUT}" ;;
          esac

  release:
    name: Publish release
    needs: tag
    if: needs.tag.outputs.tag != ''
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}

  image:
    name: Publish container image
    needs: tag
    if: needs.tag.outputs.tag != ''
    uses: ./.github/workflows/docker-image.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
